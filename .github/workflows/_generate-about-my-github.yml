name: Generate about-my-github assets

on:
  workflow_call:
    outputs:
      assets_changed:
        description: Whether generated assets changed.
        value: ${{ jobs.generate.outputs.assets_changed }}

jobs:
  generate:
    runs-on: ubuntu-latest
    outputs:
      assets_changed: ${{ steps.diff.outputs.assets_changed || 'false' }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_PAT || github.token }}
      XDG_CONFIG_HOME: ${{ github.workspace }}/.runtime-config

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Update GitHub data
        id: data
        run: |
          bun run update:about-my-github "${{ github.repository_owner }}"

          if git diff --quiet -- assets/about-my-github/about-my-github.json; then
            printf 'changed=false\n' >> "$GITHUB_OUTPUT"
          else
            printf 'changed=true\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Rust
        if: steps.data.outputs.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun dependencies
        if: steps.data.outputs.changed == 'true'
        run: bun install

      - name: Install codesnap
        if: steps.data.outputs.changed == 'true'
        run: cargo install codesnap-cli --locked --version 0.13.1

      - name: Configure codesnap
        if: steps.data.outputs.changed == 'true'
        run: |
          mkdir -p "$XDG_CONFIG_HOME/codesnap"
          cp -R .config/codesnap/. "$XDG_CONFIG_HOME/codesnap/"

          bun -e '
            import { readFileSync, writeFileSync } from "node:fs";
            import { join } from "node:path";

            const codesnapDir = join(process.env.XDG_CONFIG_HOME!, "codesnap");
            const themesDir = join(codesnapDir, "remote_themes");
            const fontsDir = join(codesnapDir, "remote_fonts");

            for (const filename of ["catppuccin-latte.json", "catppuccin-mocha.json"]) {
              const path = join(codesnapDir, filename);
              const config = JSON.parse(readFileSync(path, "utf8"));
              config.snapshot_config.themes_folders = [themesDir];
              config.snapshot_config.fonts_folders = [fontsDir];
              writeFileSync(path, JSON.stringify(config, null, 2));
            }
          '

      - name: Generate images
        if: steps.data.outputs.changed == 'true'
        run: |
          bun run generate:images
          bun run render:profile

      - name: Check generated changes
        if: steps.data.outputs.changed == 'true'
        id: diff
        run: |
          if git diff --quiet -- assets; then
            echo "assets_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "assets_changed=true" >> "$GITHUB_OUTPUT"
          tar -czf generated-assets.tgz assets

      - name: Upload generated assets
        if: steps.diff.outputs.assets_changed == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: generated-assets
          path: generated-assets.tgz
          retention-days: 1
